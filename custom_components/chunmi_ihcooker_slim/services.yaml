search_recipes:
  name: Search recipes
  description: Search the recipe library by Chinese or English name, ingredient or ID.
  fields:
    device_id:
      name: Device
      description: Target cooker. Optional when only one cooker is configured.
      selector:
        device:
          integration: chunmi_ihcooker_slim
    query:
      name: Search query
      description: Omit to use the Recipe search query text entity.
      example: 大阪烧
      selector:
        text:
    limit:
      name: Maximum results
      default: 20
      selector:
        number:
          min: 1
          max: 100
    favorites_only:
      name: Favorites only
      default: false
      selector:
        boolean:
  response:
    recipes:
      description: Matching recipes with localized names, images and favorite flags.
    language:
      description: Language code used for localized names.
    total:
      description: Total number of recipes in the library.

get_recipe:
  name: Get recipe details
  description: Return a recipe with localized ingredients, steps, tips and slim cookcode.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    recipe:
      name: Recipe
      description: Recipe ID or name, in Chinese or English.
      required: true
      example: 4432
      selector:
        text:
    language:
      name: Language
      description: Display language for this response.
      default: ha
      selector:
        select:
          options:
            - ha
            - original
  response:
    id:
      description: Recipe ID.
    name:
      description: Localized recipe name.
    ingredients:
      description: Localized ingredient list with quantities.
    steps:
      description: Localized cooking steps.

start_recipe:
  name: Start cloud recipe locally
  description: >-
    Start a bundled Joyami recipe through local miIO. The 160-byte profile is
    normalized with operation source 01 and a fresh CRC before it is sent.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    recipe:
      name: Recipe
      description: Recipe ID or name, in Chinese or English.
      required: true
      example: 4209
      selector:
        text:
  response:
    id:
      description: Recipe ID that was started.
    name:
      description: Localized recipe name.
    active_cooking:
      description: True when the cooker reported an active cooking state after the command.
    waiting_for_panel:
      description: True when the profile was accepted but the cooker is waiting for a knob press.

add_favorite:
  name: Save recipe to favorites
  description: Save a recipe to the local favorites list in Home Assistant.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    recipe:
      name: Recipe
      description: Recipe ID or name, in Chinese or English.
      required: true
      selector:
        text:

remove_favorite:
  name: Remove recipe from favorites
  description: Remove a recipe from the local favorites list in Home Assistant.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    recipe:
      name: Recipe
      description: Recipe ID or name, in Chinese or English.
      required: true
      selector:
        text:

list_favorites:
  name: List favorite recipes
  description: Return all locally saved favorite recipes.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
  response:
    recipes:
      description: Favorite recipes with localized names and images.

refresh_recipes:
  name: Refresh recipes
  description: >-
    Redownload the public Joyami catalogue, merge bundled translations and use
    Google Translate for missing text. Failures keep the bundled catalogue.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
  response:
    count:
      description: Number of recipes available after the refresh.
    last_refresh:
      description: Timestamp of the successful refresh.
    error:
      description: Error message when the refresh failed, otherwise null.
    translation_warning:
      description: Translation warning, otherwise null.

set_recipe_language:
  name: Set recipe language
  description: Switch recipe text between the Home Assistant language and original Chinese.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    language:
      name: Language
      required: true
      default: ha
      selector:
        select:
          options:
            - ha
            - original
  response:
    language:
      description: Active bundled language code.

translate_recipe:
  name: Translate a recipe
  description: >-
    Translate missing English text for one recipe using Google Translate and
    save it to the local translation and recipe caches.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    recipe:
      name: Recipe
      description: Recipe ID or name, in Chinese or English.
      required: true
      selector:
        text:
  response:
    id:
      description: Recipe ID.
    name:
      description: Localized recipe name.
    translated:
      description: Number of strings translated.
    failed:
      description: Number of strings that could not be translated.
    error:
      description: First translation error, or null.
