        text:

get_selfcheck:
  name: Run self check
  description: MIoT action 3/12. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    command:
      name: Command
      required: true
      selector:
        number:
          min: 0
          max: 255

start_simple_recipe:
  name: Start simple recipe
  description: >-
    Build a single-stage cook script and start it (MIoT action 3/1). The
    generated profile uses the same layout as the Mi Home plugin.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    name:
      name: Recipe name
      required: true
      selector:
        text:
    minutes:
      name: Minutes
      required: true
      selector:
        number:
          min: 1
          max: 240
    mode:
      name: Mode
      required: true
      selector:
        select:
          options:
            - fire
            - temperature
    value:
      name: Fire level or temperature
      required: true
      selector:
        number:
          min: 1
          max: 1000
    menu_index:
      name: Menu index
      default: 9
      selector:
        number:
          min: 0
          max: 255

set_simple_menu:
  name: Save simple recipe
  description: Build a single-stage cook script and save it with MIoT action 3/5.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    name:
      name: Recipe name
      required: true
      selector:
        text:
    minutes:
      name: Minutes
      required: true
      selector:
        number:
          min: 1
          max: 240
    mode:
      name: Mode
      required: true
      selector:
        select:
          options:
            - fire
            - temperature
    value:
      name: Fire level or temperature
      required: true
      selector:
        number:
          min: 1
          max: 1000
    menu_index:
      name: Menu index
      default: 9
      selector:
        number:
          min: 0
          max: 255
    bell:
      name: Bell
      default: false
      selector:
        boolean:
