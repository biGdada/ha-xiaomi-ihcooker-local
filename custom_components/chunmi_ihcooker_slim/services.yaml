start_preset:
  name: Start app preset
  description: >-
    Start one of the five Mi Home presets by name. By default this uses the
    built-in mode action (2/1); choose "recipe" to build and send the matching
    cook profile through action 3/1 instead. The built-in path was verified on
    firmware 2.2.0_0005; the recipe path uses the same argument format but has
    not been individually tested.
  fields:
    device_id:
      name: Device
      description: Target cooker device ID. Optional when only one cooker is configured.
      selector:
        device:
          integration: chunmi_ihcooker_slim
    preset:
      name: Preset
      description: 火锅 / 蒸煮 / 煲汤 / 煎炒 / 油炸.
      required: true
      default: hotpot
      selector:
        select:
          options:
            - hotpot
            - steam_boil
            - simmer
            - stir_fry
            - deep_fry
    method:
      name: Start method
      description: Built-in mode is simpler; recipe sends a generated cook profile.
      default: built_in
      selector:
        select:
          options:
            - built_in
            - recipe
    minutes:
      name: Minutes
      description: Optional duration override for the recipe method.
      selector:
        number:
          min: 1
          max: 240
          mode: slider
    fire:
      name: Fire level
      description: Optional fire override for the recipe method (0-255).
      selector:
        number:
          min: 0
          max: 255
    temperature:
      name: Temperature
      description: Optional temperature override for the recipe method (0-255).
      selector:
        number:
          min: 0
          max: 255

start_cook:
  name: Start built-in mode
  description: >-
    Start one of the five built-in modes using MIoT action 2/1. Verified on
    firmware 2.2.0_0005: mode 1 starts heating without a panel press and can be
    stopped with cancel_cooking.
  fields:
    device_id:
      name: Device
      description: Target cooker device ID. Optional when only one cooker is configured.
      selector:
        device:
          integration: chunmi_ihcooker_slim
    mode:
      name: Mode
      description: 1=Hotpot, 2=Steam boil, 3=Simmer, 4=Stir fry, 5=Deep fry.
      required: true
      selector:
        number:
          min: 1
          max: 5
          mode: slider

cancel_cooking:
  name: Cancel cooking
  description: Cancel the current program (verified working on 2.2.0_0005).
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

pause:
  name: Pause
  description: Pause the current program (verified working on 2.2.0_0005).
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

start_cooking:
  name: Start recipe
  description: >-
    Start a raw cook script. Requires a GBK recipe name and a hex cook_data
    string. Firmware handlers are present; local behaviour is not yet hardware-verified.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    name:
      name: Recipe name
      required: true
      selector:
        text:
    cook_data:
      name: Cook data
      description: Hex encoded cook script with trailing CRC-16.
      required: true
      selector:
        text:

pause_cooking:
  name: Pause cooking (v2)
