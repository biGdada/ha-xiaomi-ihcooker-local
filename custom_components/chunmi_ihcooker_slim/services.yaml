        boolean:

continue_cooking:
  name: Continue cooking
  description: MIoT action 3/7. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

next_step:
  name: Next step
  description: MIoT action 3/8. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

factory_reset:
  name: Factory reset
  description: MIoT action 3/9. Use with care. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

set_charge:
  name: Set charge
  description: MIoT action 3/10. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    cook_data:
      name: Charge data
      required: true
