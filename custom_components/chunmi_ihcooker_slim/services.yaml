start_cook:
  name: Start built-in mode
  description: >-
    Start one of the five built-in modes using MIoT action 2/1. This action is
    not implemented locally on firmware 2.2.0_0005 and will report an error.
  fields:
    device_id:
      name: Device
      description: Target cooker device ID. Optional when only one cooker is configured.
      selector:
        device:
          integration: chunmi_ihcooker_slim
    mode:
      name: Mode
      description: 1=Hotpot, 2=Steam boil, 3=Simmer, 4=Stir fry, 5=Deep fry.
      required: true
      selector:
        number:
          min: 1
          max: 5
          mode: slider

cancel_cooking:
  name: Cancel cooking
  description: Cancel the current program (verified working on 2.2.0_0005).
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

pause:
  name: Pause
  description: Pause the current program (verified working on 2.2.0_0005).
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

start_cooking:
  name: Start recipe
  description: >-
    Start a raw cook script. Requires a GBK recipe name and a hex cook_data
    string. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    name:
      name: Recipe name
      required: true
      selector:
        text:
    cook_data:
      name: Cook data
      description: Hex encoded cook script with trailing CRC-16.
      required: true
      selector:
        text:

pause_cooking:
  name: Pause cooking (v2)
  description: MIoT action 3/2. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

resume_cooking:
  name: Resume cooking
  description: MIoT action 3/3. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

cancel_cooking_v2:
  name: Cancel cooking (v2)
  description: MIoT action 3/4. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim

set_menu:
  name: Save recipe to menu
  description: MIoT action 3/5. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    name:
      name: Recipe name
      required: true
      selector:
        text:
    cook_data:
      name: Cook data
      required: true
      selector:
        text:
    bell:
      name: Bell
      default: false
      selector:
        boolean:

delete_menu:
  name: Delete menu entry
  description: MIoT action 3/6. Cloud-only on firmware 2.2.0_0005.
  fields:
    device_id:
      name: Device
      selector:
        device:
          integration: chunmi_ihcooker_slim
    menu_order:
      name: Menu slot
      required: true
      selector:
        number:
